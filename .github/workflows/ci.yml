name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${ github.ref }
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify (${ matrix.os })
    runs-on: ${ matrix.os }
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Run Verify
        run: swift run Verify
        timeout-minutes: 5

      - name: Run swift test (XCTest)
        run: swift test
        timeout-minutes: 10

      - name: Format check (informational)
        run: swift-format lint -r Sources || echo "::warning::swift-format 有格式问题(不影响构建)"
        continue-on-error: true

  release-package:
    name: Package (release, tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./packaging/build-package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodingTokenBar-mac
          path: |
            dist/*.dmg
            dist/*.app
